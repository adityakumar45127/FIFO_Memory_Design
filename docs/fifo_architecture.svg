<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="700" fill="#f8fafc"/>

  <!-- Title -->
  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Synchronous FIFO Architecture (8-bit × 16-Depth)</text>
  <text x="560" y="54" text-anchor="middle" font-size="13" fill="#475569">Top-Level Module: sync_fifo_top | Single Clock | Synchronous Reset</text>

  <!-- Top-Level Bounding Box -->
  <rect x="120" y="72" width="880" height="590" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="140" y="96" font-size="14" font-weight="700" fill="#334155">sync_fifo_top</text>

  <!-- Clock and Reset Distribution Buses -->
  <line x1="25" y1="120" x2="860" y2="120" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="30" y="114" font-size="13" font-weight="600" fill="#334155">clk</text>
  <line x1="25" y1="145" x2="835" y2="145" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="30" y="139" font-size="13" font-weight="600" fill="#334155">rst</text>

  <!-- Clock/Reset taps to fifo_status -->
  <circle cx="860" cy="120" r="3" fill="#64748b"/>
  <line x1="860" y1="120" x2="860" y2="178" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="835" cy="145" r="3" fill="#94a3b8"/>
  <line x1="835" y1="145" x2="835" y2="178" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Clock/Reset vertical spine on left for pointers and memory -->
  <circle cx="155" cy="120" r="3" fill="#64748b"/>
  <line x1="155" y1="120" x2="155" y2="540" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="170" cy="145" r="3" fill="#94a3b8"/>
  <line x1="170" y1="145" x2="170" y2="565" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Clock/Reset taps to fifo_wr_ptr -->
  <line x1="155" y1="415" x2="218" y2="415" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="170" y1="435" x2="218" y2="435" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Clock/Reset taps to fifo_rd_ptr -->
  <line x1="155" y1="540" x2="218" y2="540" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="170" y1="565" x2="218" y2="565" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Clock/Reset taps to fifo_memory -->
  <circle cx="650" cy="120" r="3" fill="#64748b"/>
  <path d="M 650 120 L 650 388" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <circle cx="675" cy="145" r="3" fill="#94a3b8"/>
  <path d="M 675 145 L 675 388" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- External Inputs (Left) -->
  <line x1="25" y1="220" x2="218" y2="220" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="30" y="213" font-size="13" font-weight="600" fill="#1d4ed8">wr_en</text>

  <line x1="25" y1="255" x2="218" y2="255" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="30" y="248" font-size="13" font-weight="600" fill="#0f766e">rd_en</text>

  <path d="M 25 630 L 635 630 L 635 582" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="30" y="622" font-size="13" font-weight="600" fill="#1d4ed8">wr_data [7:0]</text>

  <!-- 1. FIFO Control Logic Box -->
  <rect x="220" y="180" width="210" height="165" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="325" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">fifo_ctrl</text>
  <text x="325" y="222" text-anchor="middle" font-size="11.5" fill="#475569">FIFO Control Logic</text>
  <rect x="236" y="236" width="178" height="94" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="325" y="258" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1e293b">wr_valid = wr_en &amp; ~full</text>
  <text x="325" y="278" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1e293b">rd_valid = rd_en &amp; ~empty</text>
  <text x="325" y="301" text-anchor="middle" font-size="11" fill="#64748b">Overflow &amp; Underflow</text>
  <text x="325" y="317" text-anchor="middle" font-size="11" fill="#64748b">Prevention Gating</text>

  <!-- 2. Full & Empty Detection Box -->
  <rect x="705" y="180" width="245" height="165" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="827" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">fifo_status</text>
  <text x="827" y="222" text-anchor="middle" font-size="11.5" fill="#475569">Full &amp; Empty Detection</text>
  <rect x="721" y="236" width="213" height="94" rx="5" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="827" y="257" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1e293b">fifo_count [4:0] (0..16)</text>
  <text x="827" y="280" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1e293b">empty = (fifo_count == 0)</text>
  <text x="827" y="302" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1e293b">full  = (fifo_count == 16)</text>

  <!-- Signals between fifo_ctrl and fifo_status -->
  <!-- wr_valid -->
  <line x1="430" y1="215" x2="703" y2="215" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="565" y="208" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d4ed8">wr_valid (count_wr_en)</text>

  <!-- rd_valid -->
  <line x1="430" y1="248" x2="703" y2="248" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="565" y="241" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">rd_valid (count_rd_en)</text>

  <!-- full feedback -->
  <line x1="705" y1="286" x2="432" y2="286" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="565" y="279" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">full</text>

  <!-- empty feedback -->
  <line x1="705" y1="316" x2="432" y2="316" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="565" y="309" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">empty</text>

  <!-- External Status Flag Outputs (Right) -->
  <line x1="950" y1="230" x2="1090" y2="230" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="1030" y="222" font-size="13" font-weight="600" fill="#b91c1c">full</text>

  <line x1="950" y1="295" x2="1090" y2="295" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="1030" y="287" font-size="13" font-weight="600" fill="#b91c1c">empty</text>

  <!-- 3. Write Pointer Box -->
  <rect x="220" y="390" width="210" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="325" y="415" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">fifo_wr_ptr</text>
  <text x="325" y="434" text-anchor="middle" font-size="11.5" fill="#475569">4-bit Write Pointer (0..15)</text>
  <text x="325" y="458" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1e293b">wr_ptr &lt;= wr_ptr + 4'd1</text>

  <!-- 4. Read Pointer Box -->
  <rect x="220" y="510" width="210" height="90" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="325" y="535" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">fifo_rd_ptr</text>
  <text x="325" y="554" text-anchor="middle" font-size="11.5" fill="#475569">4-bit Read Pointer (0..15)</text>
  <text x="325" y="578" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1e293b">rd_ptr &lt;= rd_ptr + 4'd1</text>

  <!-- Control signals down to pointers & memory -->
  <!-- wr_ptr_inc & mem_wr_en -->
  <circle cx="465" cy="215" r="3" fill="#2563eb"/>
  <path d="M 465 215 L 465 405 L 432 405" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <circle cx="465" cy="405" r="3" fill="#2563eb"/>
  <path d="M 465 405 L 558 405" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="515" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">mem_wr_en</text>

  <!-- rd_ptr_inc & mem_rd_en -->
  <circle cx="490" cy="248" r="3" fill="#0d9488"/>
  <path d="M 490 248 L 490 525 L 432 525" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
  <circle cx="490" cy="525" r="3" fill="#0d9488"/>
  <path d="M 490 525 L 558 525" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
  <text x="524" y="518" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">mem_rd_en</text>

  <!-- 5. FIFO Memory Array Box -->
  <rect x="560" y="390" width="350" height="190" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="735" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">fifo_memory</text>
  <text x="735" y="438" text-anchor="middle" font-size="12" fill="#475569">16 × 8-bit Synchronous Memory Array</text>
  <rect x="588" y="455" width="294" height="104" rx="5" fill="#ffffff" stroke="#fde047" stroke-width="1"/>
  <text x="735" y="480" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1e293b">reg [7:0] mem [0:15]</text>
  <text x="735" y="505" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#1d4ed8">Write: mem[wr_addr] &lt;= wr_data</text>
  <text x="735" y="528" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#0f766e">Read : rd_data &lt;= mem[rd_addr]</text>
  <text x="735" y="548" text-anchor="middle" font-size="10.5" fill="#64748b">(Registered Synchronous Read Output)</text>

  <!-- Pointer connections to Memory -->
  <line x1="430" y1="445" x2="558" y2="445" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="495" y="438" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15803d">wr_ptr [3:0]</text>

  <line x1="430" y1="560" x2="558" y2="560" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <text x="495" y="553" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">rd_ptr [3:0]</text>

  <!-- External Read Data Output (Right) -->
  <line x1="910" y1="485" x2="1090" y2="485" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="1015" y="476" font-size="13" font-weight="600" fill="#0f766e">rd_data [7:0]</text>

  <!-- Legend Footer -->
  <text x="560" y="685" text-anchor="middle" font-size="11.5" fill="#64748b">6 RTL Modules: sync_fifo_top, fifo_ctrl, fifo_wr_ptr, fifo_rd_ptr, fifo_status, fifo_memory</text>
</svg>
